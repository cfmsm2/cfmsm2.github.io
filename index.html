<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snappy Chess</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202124;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    .game {
      width: min(92vw, 560px);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 4px solid #111;
      border-radius: 4px;
      overflow: hidden;
    }
		.piece-image {
	  display: block;
	  width: 100%;
	  height: 100%;
	  object-fit: contain;
	  position: relative;
	  z-index: 1;
	  pointer-events: none;
	  user-select: none;
	  -webkit-user-drag: none;
	}
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: none;
      padding: 0;
      cursor: pointer;
      position: relative;
      font-size: clamp(24px, 7vw, 52px);
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .light {
      background: #eeeed2;
    }

    .dark {
      background: #769656;
    }

    .selected {
      background: #f6f669 !important;
    }

    .legal::after {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.23);
    }

    .legal.capture::after {
      width: 85%;
      height: 85%;
      background: transparent;
      border: 5px solid rgba(0, 0, 0, 0.23);
    }

    .piece {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.2));
    }

    .white-piece {
      color: #fff;
      -webkit-text-stroke: 1px #222;
      text-shadow: 1px 1px 1px #222;
    }

    .black-piece {
      color: #181818;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    button.action {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #resign {
      background: #b83b3b;
      color: white;
    }

    #newGame {
      background: #769656;
      color: white;
    }

    button.action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.action:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="game">
    <div id="board" aria-label="Chess board"></div>

	<div class="controls">
	  <button id="resign" class="action">Resign</button>
	  <button id="newGame" class="action">New Game</button>
	  <button id="copyPGN" class="action" hidden>Copy PGN/Share Game</button>
	</div>
  </main>

  <script type=module>
    import { Chess } from
    "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";
    const game = new Chess();
	
let snappyWasm = null;

const pieceCodes = {
  p: 1,
  n: 2,
  b: 3,
  r: 4,
  q: 5,
  k: 6
};

let currentMoves = [];

function squareToIndex(square) {
  const file = square.charCodeAt(0) - 97;
  const rank = Number(square[1]) - 1;

  return rank * 8 + file;
}

function indexToSquare(index) {
  const file = String.fromCharCode(97 + (index % 8));
  const rank = Math.floor(index / 8) + 1;

  return file + rank;
}

const wasmImports = {
  env: {
    getMoveCount() {
      currentMoves = game.moves({ verbose: true });
      return currentMoves.length;
    },
	abort(message, fileName, lineNumber, columnNumber) {
      console.error("Snappy WASM aborted:", {
        message,
        fileName,
        lineNumber,
        columnNumber
      });
    },
    getMoveCount() {
      currentMoves = game.moves({ verbose: true });
      return currentMoves.length;
    },
    getMoveFrom(index) {
      return squareToIndex(currentMoves[index].from);
    },

    getMoveTo(index) {
      return squareToIndex(currentMoves[index].to);
    },

    getMovePromotion(index) {
      const promotion = currentMoves[index].promotion;

      if (!promotion) return 0;

      return {
        q: 1,
        r: 2,
        b: 3,
        n: 4
      }[promotion] || 0;
    },

    makeMove(from, to, promotion) {
      try {
        const move = {
          from: indexToSquare(from),
          to: indexToSquare(to)
        };

        if (promotion !== 0) {
          move.promotion = {
            1: "q",
            2: "r",
            3: "b",
            4: "n"
          }[promotion];
        }

        game.move(move);
        return 1;
      } catch {
        return 0;
      }
    },

    undoMove() {
      game.undo();
    },

    pieceAt(square) {
      const piece = game.get(indexToSquare(square));

      if (!piece) return 0;

      const value = pieceCodes[piece.type];

      return piece.color === "b"
        ? value
        : -value;
    },

    getTurn() {
      return game.turn() === "b" ? 1 : -1;
    },

    isCheckmate() {
      return game.isCheckmate() ? 1 : 0;
    },

    isDraw() {
      return game.isDraw() ? 1 : 0;
    }
  }
};

async function initializeSnappy() {
  const response = await fetch("./snappy.wasm");

  if (!response.ok) {
    throw new Error("Could not load snappy.wasm");
  }

  const bytes = await response.arrayBuffer();

  const result = await WebAssembly.instantiate(
    bytes,
    wasmImports
  );

  snappyWasm = result.instance.exports;

  console.log("Snappy WebAssembly AI initialized!");
}

	const ASSET_BASE_URL = "https://images.chesscomfiles.com/chess-themes/pieces/neo/300/";
	const SOUND_BASE_URL = "https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/";

	function pieceImageUrl(color, type) {
	  const colorPrefix = color === "w" ? "w" : "b";
	  return `${ASSET_BASE_URL}${colorPrefix}${type}.png`;
	}

	const sounds = {
	  move: new Audio(`${SOUND_BASE_URL}move-self.mp3`),
	  capture: new Audio(`${SOUND_BASE_URL}capture.mp3`),
	  check: new Audio(`${SOUND_BASE_URL}move-check.mp3`),
	  gameover: new Audio(`${SOUND_BASE_URL}game-end.mp3`)
	};

	function playSound(name) {
	  const sound = sounds[name];
	  if (!sound) return;
	  sound.currentTime = 0;
	  sound.play().catch(() => {});
	}
    const boardElement = document.getElementById("board");
    const resignButton = document.getElementById("resign");
    const newGameButton = document.getElementById("newGame");
	const copyPGNButton = document.getElementById("copyPGN");

    const PIECE_VALUES = {
      p: 1, n: 3, b: 3, r: 5, q: 9, k: 1 //King is 1 to avoid division by 0
    };

    const CENTER_SQUARES = ["e4", "d4", "e5", "d5"];

    const PIECES = {
      w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
      b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
    };

    let selectedSquare = null;
    let legalTargets = [];
    let gameOver = false;
    let thinking = false;

    function squareDistance(a, b) {
      const df = Math.abs(a.charCodeAt(0) - b.charCodeAt(0));
      const dr = Math.abs(Number(a[1]) - Number(b[1]));
      return Math.min(df, dr);
    }

    function distanceToCenter(move) {
      return Math.min(
        ...CENTER_SQUARES.map(center => squareDistance(move.to, center))
      );
    }

    function applyMove(move) {
      return game.move({
        from: move.from,
        to: move.to,
        promotion: move.promotion || "q"
      });
    }

	const SEARCH_DEPTH = 3;
	const MATE_SCORE = 100000;

	const SEARCH_VALUES = {
	  p: 100,
	  n: 320,
	  b: 330,
	  r: 500,
	  q: 900,
	  k: 0
	};

	function evaluatePosition() {
	  if (game.isCheckmate()) {
	    return game.turn() === "b"
	      ? -MATE_SCORE
	      : MATE_SCORE;
	  }

	  if (game.isDraw()) return 0;

	  let score = 0;
	  const board = game.board();

	  for (let rank = 0; rank < 8; rank++) {
	    for (let file = 0; file < 8; file++) {
	      const piece = board[rank][file];
	      if (!piece) continue;

	      const value = SEARCH_VALUES[piece.type];
	      const sign = piece.color === "b" ? 1 : -1;
	      score += value * sign;

	      if (piece.type === "n" ||
		  piece.type === "b" ||
		  piece.type === "q") {
		const centerDistance =
		  Math.abs(file - 3.5);
		score += (3.5 - centerDistance) * 12 * sign;
	      }
	      if (["d4", "e4", "d5", "e5"].includes(
			String.fromCharCode(97 + file) + (8 - rank)
		    )) {
			score += 2 * sign;
		    }
			      if (piece.type === "p") {
		const advancement = piece.color === "b"
		  ? rank - 1
		  : 6 - rank;

		score += advancement * 5 * sign;
	      }
	    }
	  }

	  return score;
	}
	function minimax(depth, alpha, beta, ply = 0) {
	  if (game.isCheckmate()) {
	    return game.turn() === "b"
	      ? -MATE_SCORE + ply
	      : MATE_SCORE - ply;
	  }

	  if (game.isDraw()) return 0;

	  if (depth <= 0) {
	    return evaluatePosition();
	  }

	  const maximizing = game.turn() === "b";

	  const moves = game.moves({ verbose: true });

	  // Search promising moves first.
	  moves.sort((a, b) => {
	    const score = move => {
	      let value = 0;

	      if (move.captured) {
		value += SEARCH_VALUES[move.captured] * 10;
		value -= SEARCH_VALUES[move.piece] || 0;
	      }

	      if (move.promotion) {
		value += 800;
	      }

	      return value;
	    };

	    return score(b) - score(a);
	  });

	  let bestScore = maximizing
	    ? -Infinity
	    : Infinity;

	  for (const move of moves) {
	    applyMove(move);

	    const score = minimax(
	      depth - 1,
	      alpha,
	      beta,
	      ply + 1
	    );

	    game.undo();

	    if (maximizing) {
	      bestScore = Math.max(bestScore, score);
	      alpha = Math.max(alpha, bestScore);
	    } else {
	      bestScore = Math.min(bestScore, score);
	      beta = Math.min(beta, bestScore);
	    }

	    if (beta <= alpha) break;
	  }

	  return bestScore;
	}

	// Returns ALL legal moves with their calculated scores.
	function _botMove(depth = SEARCH_DEPTH) {
	  const legalMoves = game.moves({ verbose: true });
	  const scoredMoves = [];

	  for (const move of legalMoves) {
	    applyMove(move);

	    const score = minimax(
	      depth - 1,
	      -Infinity,
	      Infinity,
	      1
	    );

	    game.undo();

	    scoredMoves.push({
	      move,
	      score
	    });
	  }

	  // Highest score means best for Snappy (black).
	  scoredMoves.sort((a, b) => b.score - a.score);

	  return scoredMoves;
	}

	// Select the highest-scoring move.

function botMove() {
  if (!snappyWasm) {
    throw new Error("Snappy AI is not initialized.");
  }

  const result = snappyWasm.bestMove(SEARCH_DEPTH);

  if (result === -1) return null;

  const from = result & 63;
  const to = (result >> 6) & 63;
  const promotion = (result >> 12) & 7;

  const fromSquare = indexToSquare(from);
  const toSquare = indexToSquare(to);

  const promotionTypes = {
    1: "q",
    2: "r",
    3: "b",
    4: "n"
  };

  const promotionType = promotionTypes[promotion];

  return game.moves({ verbose: true }).find(move =>
    move.from === fromSquare &&
    move.to === toSquare &&
    (move.promotion || undefined) === promotionType
  ) || null;
}




	function renderBoard() {
	  boardElement.innerHTML = "";

	  for (let rank = 8; rank >= 1; rank--) {
		for (let file = 0; file < 8; file++) {
		  const square = String.fromCharCode(97 + file) + rank;
		  const piece = game.get(square);
		  const button = document.createElement("button");

		  button.type = "button";
		  button.className =
			"square " + ((rank + file) % 2 === 0 ? "light" : "dark");
		  button.setAttribute("aria-label", square);

		  if (square === selectedSquare) {
			button.classList.add("selected");
		  }

		  if (legalTargets.some(move => move.to === square)) {
			button.classList.add("legal");
			if (piece) button.classList.add("capture");
		  }

		  if (piece) {
			const img = document.createElement("img");
			img.className = "piece-image";
			img.src = pieceImageUrl(piece.color, piece.type);
			img.alt =
			  `${piece.color === "w" ? "White" : "Black"} ${piece.type}`;
			img.draggable = false;

			img.onerror = () => {
			  console.error("Could not load chess piece:", img.src);
			  img.alt = "Image unavailable";
			};

			button.appendChild(img);
		  }

		  button.addEventListener("click", () => onSquareClick(square));
		  boardElement.appendChild(button);
		}
	  }

	  resignButton.disabled = gameOver;
	}


    function onSquareClick(square) {
      if (gameOver || thinking || game.turn() !== "w") return;

      const piece = game.get(square);

      if (selectedSquare) {
        const move = legalTargets.find(m => m.to === square);

        if (move) {
          const movingPiece = game.get(selectedSquare);
          const promotion =
            movingPiece?.type === "p" && square[1] === "8";

          const moveResult = game.move({
            from: selectedSquare,
            to: square,
            promotion: promotion ? "q" : undefined
          });

          selectedSquare = null;
          legalTargets = [];

		if (moveResult) {
		  playSound(
			moveResult.captured || moveResult.flags.includes("e")
			  ? "capture"
			  : "move"
		  );

		  renderBoard();

		  if (checkGameOver()) return;

            thinking = true;
            renderBoard();


			setTimeout(() => {
			  try {
				if (gameOver) return;

				const response = botMove();

		if (response) {
		  const isCapture =
			response.flags.includes("c") ||
			response.flags.includes("e");

		  applyMove(response);
		  playSound(isCapture ? "capture" : "move");
		}

			// Always release the board after Snappy's turn.
			selectedSquare = null;
			legalTargets = [];
			thinking = false;

			renderBoard();
			checkGameOver();
		  } catch (error) {
			console.error("Snappy's move failed:", error);
			thinking = false;
			renderBoard();
		  }
		}, 180);


            return;
          }
        }
      }

      if (piece && piece.color === "w") {
        selectedSquare = square;
        legalTargets = game.moves({
          square,
          verbose: true
        });
      } else {
        selectedSquare = null;
        legalTargets = [];
      }

      renderBoard();
    }

    function checkGameOver() {
      if (!game.isGameOver()) return false;

      gameOver = true;
	  playSound("gameover");
      thinking = false;
      selectedSquare = null;
      legalTargets = [];
      renderBoard();

      if (game.isCheckmate()) {
        alert(
          game.turn() === "w"
            ? "Checkmate! Snappy wins."
            : "Checkmate! You win!"
        );
      } else if (game.isStalemate()) {
        alert("Draw by stalemate!");
      } else if (game.isDraw()) {
        alert("The game is a draw!");
      } else {
        alert("Game over!");
      }
	  copyPGNButton.hidden = false;
      return true;
    }

    resignButton.addEventListener("click", () => {
      if (gameOver) return;

      if (confirm("Are you sure you want to resign?")) {
        gameOver = true;
        selectedSquare = null;
        legalTargets = [];
        renderBoard();
        alert("You resigned. Snappy wins!");
      }
    });

    newGameButton.addEventListener("click", () => {
      if (!gameOver && game.history().length > 0) {
        if (!confirm("Start a new game? Your current game will be lost.")) {
          return;
        }
      }
	
	copyPGNButton.addEventListener("click", async () => {
	  const pgn = game.pgn();
	  try {
		await navigator.clipboard.writeText(pgn);
		alert("PGN copied to clipboard!");
	  } catch (error) {
		// Fallback for browsers where Clipboard API is unavailable.
		const textarea = document.createElement("textarea");
		textarea.value = pgn;
		textarea.style.position = "fixed";const opponent = game.turn() === "w" ? "b" : "w";
		textarea.style.opacity = "0";
		document.body.appendChild(textarea);
		textarea.select();

		const copied = document.execCommand("copy");
		textarea.remove();

		if (copied) {
		  alert("PGN copied to clipboard!");
		} else {
		  alert("Unable to copy PGN. Please copy it manually:\n\n" + pgn);
		}
	  }
	});

      game.reset();
      selectedSquare = null;
      legalTargets = [];
      gameOver = false;
      thinking = false;
      renderBoard();
    });

    initializeSnappy()
  .then(() => {
    console.log("Snappy is ready!");
    renderBoard();
  })
  .catch(error => {
    console.error("Failed to initialize Snappy:", error);
    alert("Snappy AI failed to load. Check the browser console.");
  });
  </script>
</body>
</html>
